     no WhatsApp (o mesmo do /painel, só o número dele). Quem decide tudo é a função "grupos"

<style>
:root{
  --ink:#09110E;--text:#F1F4F1;--muted:#9CABA2;--muted-dim:#6F8077;
  --line:rgba(255,255,255,.1);--line-soft:rgba(255,255,255,.065);
  --credit:#21CA70;--credit-hi:#3FE08A;--warn:#FBBF24;--err:#F08A6C;--blue:#6BA8D8;
  --display:"Raleway","Helvetica Neue",Arial,sans-serif;
  --body:"Outfit","Helvetica Neue",Arial,sans-serif;
  --vidro:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;font-variant-numeric:lining-nums}
a{color:var(--credit-hi)}
:focus-visible{outline:2px solid var(--credit);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
p{margin:0}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}

.gp-aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,#10241A,transparent 65%),var(--ink)}

.gp-nav{position:sticky;top:0;z-index:60;padding:10px 12px 0}
.gp-nav__in{display:flex;align-items:center;gap:.75rem;max-width:1180px;margin:0 auto;padding:.45rem .5rem .45rem .7rem;border-radius:999px;background:linear-gradient(180deg,rgba(18,30,24,.86),rgba(12,20,16,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line),0 12px 40px -16px rgba(0,0,0,.7)}
.gp-marca{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:800;white-space:nowrap}
.gp-marca i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#04140B;background:linear-gradient(135deg,#3FE08A,#17A85E)}
.gp-abas{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.gp-abas::-webkit-scrollbar{display:none}
.gp-aba{background:none;border:0;border-radius:999px;padding:.5em .9em;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:.92rem}
.gp-aba:hover{color:var(--text)}
.gp-aba[aria-selected="true"]{background:rgba(33,202,112,.14);color:var(--credit-hi);box-shadow:inset 0 0 0 1px rgba(33,202,112,.35)}
.gp-aba b{display:inline-block;min-width:1.35em;padding:0 .35em;margin-left:.35em;border-radius:999px;background:var(--credit);color:#04140B;font-size:.72rem;line-height:1.35em;text-align:center}
.gp-sair{background:none;border:0;color:var(--muted-dim);cursor:pointer;font-size:.85rem;padding:.4em .7em;white-space:nowrap}
@media(max-width:720px){.gp-marca span{display:none}}

main{max-width:1180px;margin:0 auto;padding:22px 14px 90px}

.gp-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.62em 1.1em;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--text);background:var(--vidro);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s}
.gp-btn:hover{box-shadow:inset 0 0 0 1px rgba(33,202,112,.45)}
.gp-btn--pri{background:linear-gradient(135deg,#2AD47A,#1DB86B);color:#04140B;box-shadow:0 8px 26px -10px rgba(33,202,112,.6)}
.gp-btn--pri:hover{transform:translateY(-1px)}
.gp-btn--sm{padding:.42em .85em;font-size:.82rem}
.gp-btn--perigo{color:var(--err)}
.gp-btn[disabled]{opacity:.45;cursor:not-allowed}

.gp-caixa{background:var(--vidro);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);padding:1rem 1.1rem}
.gp-titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:6px 0 16px}
.gp-titulo h1{font-size:clamp(1.35rem,3vw,1.75rem)}
.gp-titulo p{color:var(--muted);font-size:.92rem;margin-top:.25rem}
.gp-acoes{display:flex;gap:.5rem;flex-wrap:wrap}
.gp-aviso{border-radius:14px;padding:.75rem 1rem;margin-bottom:14px;font-size:.92rem;background:rgba(251,191,36,.08);box-shadow:inset 0 0 0 1px rgba(251,191,36,.3);color:#F6DFA0}
.gp-aviso--erro{background:rgba(240,138,108,.08);box-shadow:inset 0 0 0 1px rgba(240,138,108,.35);color:#F6C2B2}
.gp-vazio{color:var(--muted);text-align:center;padding:2.2rem 1rem}

.gp-numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.gp-num{padding:.8rem 1rem;border-radius:16px;background:var(--vidro);box-shadow:inset 0 0 0 1px var(--line)}
.gp-num strong{display:block;font-family:var(--display);font-size:1.6rem}
.gp-num span{color:var(--muted);font-size:.82rem}
.gp-num--acao{cursor:pointer}
.gp-num--acao:hover{box-shadow:inset 0 0 0 1px rgba(33,202,112,.45)}

.gp-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.gp-card{display:flex;flex-direction:column;gap:.55rem}
.gp-card__topo{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.gp-card h3{font-size:1.02rem}
.gp-meta{color:var(--muted);font-size:.8rem}
.gp-resumo{white-space:pre-wrap;font-size:.9rem;color:#D9E2DC;line-height:1.5}
.gp-resumo--vazio{color:var(--muted-dim);font-style:italic}
.gp-selo{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:.18em .6em;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.06);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-soft)}
.gp-selo--instrucoes{background:rgba(107,168,216,.13);color:#A9CDEB}
.gp-selo--licenciados{background:rgba(33,202,112,.12);color:var(--credit-hi)}
.gp-selo--envios{background:rgba(251,191,36,.1);color:#F3D27A}
.gp-selo--sug{background:rgba(63,224,138,.08);color:#9FE8BE}
.gp-selo--novo{background:var(--credit);color:#04140B}

.gp-item{display:grid;gap:.4rem;padding:.9rem 1rem;border-radius:16px;background:var(--vidro);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.gp-item--novo{box-shadow:inset 0 0 0 1px rgba(33,202,112,.45)}
.gp-item h3{font-size:1rem}
.gp-item__det{white-space:pre-wrap;color:#D9E2DC;font-size:.9rem}
.gp-filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:12px}
.gp-chip{border:0;cursor:pointer;border-radius:999px;padding:.4em .85em;font-size:.84rem;background:rgba(255,255,255,.05);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-soft)}
.gp-chip[aria-pressed="true"]{background:rgba(33,202,112,.14);color:var(--credit-hi);box-shadow:inset 0 0 0 1px rgba(33,202,112,.35)}

.gp-busca{width:100%;padding:.7em 1em;border-radius:12px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);outline:none}
.gp-busca:focus{box-shadow:inset 0 0 0 1px rgba(33,202,112,.55)}
.gp-tab{width:100%;border-collapse:collapse;font-size:.9rem}
.gp-tab th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
.gp-tab td{padding:.55rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.gp-tab tr:hover td{background:rgba(255,255,255,.02)}
.gp-tab .gp-nome{font-weight:600}
.gp-tab select{background:rgba(0,0,0,.25);border:0;border-radius:8px;padding:.35em .5em;box-shadow:inset 0 0 0 1px var(--line);max-width:150px}
@media(max-width:760px){.gp-tab .gp-col-opc{display:none}}

.gp-chave{position:relative;width:42px;height:24px;flex:none;border:0;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.12);transition:background .2s}
.gp-chave::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#C9D3CD;transition:transform .2s}
.gp-chave[aria-checked="true"]{background:var(--credit)}
.gp-chave[aria-checked="true"]::after{transform:translateX(18px);background:#fff}

.gp-campo{display:grid;gap:.35rem;margin-bottom:.9rem}
.gp-campo>span{font-size:.82rem;color:var(--muted)}
.gp-campo textarea,.gp-campo input:not([type=checkbox]),.gp-campo select{width:100%;padding:.65em .8em;border-radius:12px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);outline:none}
.gp-campo textarea{min-height:130px;resize:vertical;line-height:1.45}
.gp-campo textarea:focus,.gp-campo input:not([type=checkbox]):focus,.gp-campo select:focus{box-shadow:inset 0 0 0 1px rgba(33,202,112,.55)}
.gp-linha{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.gp-dias{display:flex;gap:.3rem;flex-wrap:wrap}
.gp-dias label{display:inline-flex;align-items:center;gap:.3em;padding:.35em .7em;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line-soft);cursor:pointer;font-size:.85rem}
.gp-escolha{max-height:260px;overflow:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:.3rem}
.gp-escolha label{display:flex;gap:.55rem;align-items:center;padding:.4rem .5rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.gp-escolha label:hover{background:rgba(255,255,255,.04)}
.gp-escolha input,.gp-dias input{width:auto;margin:0;accent-color:var(--credit)}
.gp-escolha small{color:var(--muted-dim);margin-left:auto;white-space:nowrap}
.gp-dois{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.gp-dois{grid-template-columns:1fr}}

.gp-resposta{white-space:pre-wrap;line-height:1.6;font-size:.95rem}

.gp-msg{font-size:.88rem;line-height:1.45;padding:.5rem .65rem;border-radius:12px;margin:.25rem 0;background:rgba(255,255,255,.035);max-width:92%}
.gp-msg--mim{margin-left:auto;background:rgba(33,202,112,.1)}
.gp-msg--marca{box-shadow:inset 0 0 0 1px rgba(251,191,36,.6)}
.gp-msg b{display:block;font-size:.76rem;color:var(--credit-hi);font-weight:600}
.gp-msg i{display:block;font-style:normal;font-size:.78rem;color:var(--muted);border-left:2px solid var(--line);padding-left:.5rem;margin:.2rem 0}
.gp-msg time{display:block;text-align:right;font-size:.68rem;color:var(--muted-dim)}

.gp-folha{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(0,0,0,.5)}
.gp-folha__in{width:min(560px,100%);height:100%;background:#0D1712;box-shadow:-20px 0 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column}
.gp-folha__topo{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.gp-folha__corpo{overflow:auto;padding:.8rem 1rem 2rem;flex:1}

.gp-entrar{max-width:420px;margin:8vh auto 0;text-align:center;display:grid;gap:1rem}
.gp-entrar input{text-align:center;font-size:1.1rem;padding:.8em;border-radius:14px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);outline:none}
.gp-msgerro{color:var(--err);font-size:.9rem}
.gp-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;padding:.7em 1.2em;border-radius:999px;background:#13241B;box-shadow:inset 0 0 0 1px rgba(33,202,112,.4),0 10px 30px rgba(0,0,0,.5);font-size:.9rem}
</style>

<div class="gp-aurora" aria-hidden="true"></div>

<header class="gp-nav">
  <div class="gp-nav__in">
    <div class="gp-marca"><i>✦</i><span>Grupos</span></div>
    <nav class="gp-abas" id="abas" role="tablist" hidden>
      <button class="gp-aba" role="tab" data-aba="hoje">Hoje</button>
      <button class="gp-aba" role="tab" data-aba="instrucoes">Instruções<b id="n-instrucoes" hidden></b></button>
      <button class="gp-aba" role="tab" data-aba="voce">Para você<b id="n-voce" hidden></b></button>
      <button class="gp-aba" role="tab" data-aba="perguntar">Perguntar</button>
      <button class="gp-aba" role="tab" data-aba="envios">Envios</button>
      <button class="gp-aba" role="tab" data-aba="grupos">Grupos</button>
    </nav>
    <button class="gp-sair" id="sair" hidden>Sair</button>
  </div>
</header>

<main>
  <section id="tela-entrar" class="gp-entrar" hidden>
    <h1>Grupos do WhatsApp</h1>
    <p style="color:var(--muted)">Entre com o seu WhatsApp. O código chega pelo número final 1575.</p>
    <div id="passo-numero" style="display:grid;gap:.8rem">
      <input id="zap" inputmode="tel" autocomplete="tel" placeholder="(48) 99106-7007">
      <button class="gp-btn gp-btn--pri" id="pedir">Receber código</button>
      <p class="gp-msgerro" id="msg-numero" hidden></p>
    </div>
    <div id="passo-codigo" style="display:grid;gap:.8rem" hidden>
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6">
      <button class="gp-btn gp-btn--pri" id="entrar">Entrar</button>
      <button class="gp-sair" id="outro">Usar outro número</button>
      <p class="gp-msgerro" id="msg-codigo" hidden></p>
    </div>
  </section>

  <p id="carregando" class="gp-vazio">Carregando…</p>

  <section id="tela" hidden>
    <div id="avisos-topo"></div>
    <div id="aba-hoje" data-painel="hoje"></div>
    <div id="aba-instrucoes" data-painel="instrucoes" hidden></div>
    <div id="aba-voce" data-painel="voce" hidden></div>
    <div id="aba-perguntar" data-painel="perguntar" hidden></div>
    <div id="aba-envios" data-painel="envios" hidden></div>
    <div id="aba-grupos" data-painel="grupos" hidden></div>
  </section>
</main>

<div class="gp-folha" id="folha" hidden>
  <div class="gp-folha__in" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
    <div class="gp-folha__topo"><h2 id="folha-titulo" style="font-size:1.05rem"></h2><button class="gp-btn gp-btn--sm" id="folha-fechar">Fechar</button></div>
    <div class="gp-folha__corpo" id="folha-corpo"></div>
  </div>
</div>
<div class="gp-toast" id="toast" hidden></div>

<script>
(function(){

  function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function token(){ try{ return localStorage.getItem(CHAVE); }catch(e){ return null; } }
  function guardar(t){ try{ t ? localStorage.setItem(CHAVE, t) : localStorage.removeItem(CHAVE); }catch(e){} }
  try{ localStorage.setItem("anp_admin", "1"); }catch(e){}

  var fmtHora = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
  var fmtDia = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });
  var fmtDiaSemana = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", weekday: "short", day: "2-digit", month: "2-digit" });
  function quando(iso){
    if(!iso) return "";
    var d = new Date(iso), hoje = fmtDia.format(new Date()), ontem = fmtDia.format(new Date(Date.now() - 864e5));
    var dia = fmtDia.format(d);
    return (dia === hoje ? "hoje" : dia === ontem ? "ontem" : dia) + " " + fmtHora.format(d);

  function diaLegivel(dia){ var p = String(dia).split("-"); return p[2] + "/" + p[1]; }
  function porDia(n){ return n >= 14 ? "~" + Math.round(n / 14) + "/dia" : n ? n + " em 14 dias" : "parado"; }

  function toast(t){ var el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ el.hidden = true; }, 3200); }

  function chamarLogin(acao, dados){
    return fetch(FN_LOGIN, { method: "POST",
      headers: {"Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY},
      body: JSON.stringify(Object.assign({ action: acao }, dados || {})) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; }); })
      .catch(function(){ return { _status: 0, error: "Sem conexão agora." }; });
  }
  function chamar(acao, dados){
    if(DEMO) return Promise.resolve(demo(acao, dados || {}));
    return fetch(FN, { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(Object.assign({ action: acao, token: token() }, dados || {})) })

      .catch(function(){ return { _status: 0, error: "Sem conexão agora. Confira a internet e tente de novo." }; });

  /* ---------- login ---------- */

  $("#zap").addEventListener("keydown", function(e){ if(e.key === "Enter") $("#pedir").click(); });
  $("#codigo").addEventListener("input", function(){ this.value = this.value.replace(/\D/g, "").slice(0, 6); if(this.value.length === 6) $("#entrar").click(); });
  $("#pedir").addEventListener("click", function(){
    var b = this, d = $("#zap").value.replace(/\D/g, "");
    if(d.length < 10){ erroEm("#msg-numero", "Informe o WhatsApp com DDD."); return; }
    b.disabled = true; b.textContent = "Enviando…"; erroEm("#msg-numero", "");
    chamarLogin("codigo", { whatsapp: d }).then(function(j){
      b.disabled = false; b.textContent = "Receber código";
      if(!j.ok){ erroEm("#msg-numero", j.error || "Não deu certo agora."); return; }
      desafio = j.desafio; $("#passo-numero").hidden = true; $("#passo-codigo").hidden = false; $("#codigo").focus();
    });
  });
  $("#entrar").addEventListener("click", function(){
    var b = this, c = $("#codigo").value.replace(/\D/g, "");
    if(c.length !== 6 || b.disabled) return;
    b.disabled = true; erroEm("#msg-codigo", "");
    chamarLogin("entrar", { desafio: desafio, codigo: c }).then(function(j){
      b.disabled = false;
      if(!j.ok || !j.token){ erroEm("#msg-codigo", j.error || "Não deu certo agora."); return; }
      guardar(j.token); carregar();
    });
  });
  $("#outro").addEventListener("click", function(){ $("#passo-codigo").hidden = true; $("#passo-numero").hidden = false; });
  $("#sair").addEventListener("click", function(){ var t = token(); guardar(null); chamarLogin("sair", { token: t }).then(function(){ location.reload(); }); });
  function telaEntrar(msg){
    $("#carregando").hidden = true; $("#tela").hidden = true; $("#abas").hidden = true; $("#sair").hidden = true;
    $("#tela-entrar").hidden = false; erroEm("#msg-numero", msg || "");
  }

  /* ---------- estado ---------- */
  var D = null, aba = (location.hash || "#hoje").slice(1);
  var nomeDe = {};
  function carregar(silencioso){

    return chamar("estado").then(function(j){
      if(j._status === 401 || j._status === 403){ guardar(null); telaEntrar(j._status === 403 ? j.error : ""); return; }

      Array.apply(null, Array(24)).map(function(_, i){ return '<option value="' + i + '"' + (i === D.config.resumo_hora ? ' selected' : '') + '>' + i + 'h</option>'; }).join("") + '</select></label>' +
      '<span class="gp-meta">Última leitura: ' + (D.config.cursor_em ? quando(D.config.cursor_em) : "ainda não") + '</span></div></div>';
    h += '<div class="gp-linha" style="margin-bottom:10px"><input class="gp-busca" id="gr-busca" placeholder="Procurar grupo…" value="' + esc(buscaGrupos) + '" style="flex:1;min-width:200px"></div>';
    h += '<div class="gp-filtros">' + [["ligados", "Ligados"], ["sugeridos", "Sugeridos"], ["meus", "Onde sou admin"], ["todos", "Todos"]].map(function(p){
      return '<button class="gp-chip" aria-pressed="' + (filtroGrupos === p[0]) + '" data-fgrupos="' + p[0] + '">' + p[1] + '</button>'; }).join("") + '</div>';
    if(!lista.length) h += '<div class="gp-caixa gp-vazio">' + (filtroGrupos === "ligados" ? 'Nenhum grupo ligado. Veja os "Sugeridos" ou "Todos".' : "Nenhum grupo aqui.") + '</div>';
    else {
      h += '<div class="gp-caixa" style="padding:.4rem .6rem;overflow-x:auto"><table class="gp-tab"><thead><tr><th style="width:56px">Ligado</th><th>Grupo</th><th class="gp-col-opc">Pessoas</th><th class="gp-col-opc">Movimento</th><th>Tipo</th><th></th></tr></thead><tbody>';
      lista.slice(0, 400).forEach(function(g){
        h += '<tr><td><button class="gp-chave" role="switch" aria-checked="' + !!g.ativo + '" data-ligar="' + esc(g.jid) + '" aria-label="Ligar ' + esc(g.nome) + '"></button></td>' +
          '<td><div class="gp-nome">' + esc(g.nome || "(sem nome)") + '</div><div class="gp-meta">' +
          (g.papel === "criador" ? "criador" : g.papel === "admin" ? "admin" : "membro") + (g.so_admins ? " · só admins falam" : "") +
          (g.sugestao && !g.ativo ? ' · <span class="gp-selo gp-selo--sug">sugerido: ' + TIPOS[g.sugestao] + '</span>' : '') + '</div></td>' +
          '<td class="gp-col-opc">' + (g.tamanho || "–") + '</td><td class="gp-col-opc">' + porDia(g.msgs_14d) + '</td>' +
          '<td><select data-tipo="' + esc(g.jid) + '">' + Object.keys(TIPOS).map(function(t){ return '<option value="' + t + '"' + (g.tipo === t ? ' selected' : '') + '>' + TIPOS[t] + '</option>'; }).join("") + '</select></td>' +
          '<td><button class="gp-btn gp-btn--sm" data-conversa="' + esc(g.jid) + '">Ver</button></td></tr>';

    el.innerHTML = h; ligar(el);

    });
    $("#cf-hora").addEventListener("change", function(){
      var h2 = Number(this.value);
      chamar("config_salvar", { resumo_hora: h2 }).then(function(j){ toast(j.error || ("Resumo do dia às " + h2 + "h.")); D.config.resumo_hora = h2; });

  /* ---------- conversa ---------- */
  function folha(titulo, html){ $("#folha-titulo").textContent = titulo; $("#folha-corpo").innerHTML = html; $("#folha").hidden = false; document.body.style.overflow = "hidden"; }
  function fecharFolha(){ $("#folha").hidden = true; document.body.style.overflow = ""; }
  $("#folha-fechar").addEventListener("click", fecharFolha);
  $("#folha").addEventListener("click", function(e){ if(e.target === this) fecharFolha(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("#folha").hidden) fecharFolha(); });
  function conversa(jid, marcar){
    folha(nomeDe[jid] || "Conversa", '<p class="gp-vazio">Carregando…</p>');
    chamar("mensagens", { jid: jid }).then(function(j){
      if(j.error){ $("#folha-corpo").innerHTML = '<div class="gp-aviso gp-aviso--erro">' + esc(j.error) + '</div>'; return; }
      var m = {}; (marcar || []).forEach(function(id){ m[id] = 1; });
      var h = j.ao_vivo ? '<div class="gp-aviso">Grupo desligado: mostrando os últimos 3 dias direto do WhatsApp, sem guardar.</div>' : '';
      if(!j.mensagens.length) h += '<p class="gp-vazio">Sem mensagens guardadas ainda.</p>';
      j.mensagens.forEach(function(x){
        h += '<div class="gp-msg' + (x.de_mim ? ' gp-msg--mim' : '') + (m[x.id] ? ' gp-msg--marca' : '') + '" id="m-' + esc(x.id) + '">' +
          '<b>' + esc(x.de_mim ? "Você" : (x.autor_nome || fone(x.autor) || "alguém")) + '</b>' +
          (x.cita_texto ? '<i>' + esc(String(x.cita_texto).slice(0, 160)) + '</i>' : '') + esc(x.texto) + '<time>' + quando(x.ts) + '</time></div>';
      });
      var c = $("#folha-corpo"); c.innerHTML = h;
      var alvo = marcar && marcar.length ? document.getElementById("m-" + marcar[0]) : null;
      if(alvo) alvo.scrollIntoView({ block: "center" }); else c.scrollTop = c.scrollHeight;
    });
  }
  function fone(j){ var d = j && /@s\.whatsapp\.net$/.test(j) ? j.split("@")[0] : ""; return d.length >= 12 ? "(" + d.slice(2, 4) + ") " + d.slice(4, -4) + "-" + d.slice(-4) : ""; }

  /* ---------- botões ---------- */
  function ligar(el){
    $$("[data-ir]", el).forEach(function(b){ b.addEventListener("click", function(){ irPara(b.dataset.ir); }); });
    $$("[data-sugeridos]", el).forEach(function(b){ b.addEventListener("click", function(){
      b.disabled = true; chamar("grupos_sugeridos").then(function(j){ toast(j.error || (j.ligados + " grupos ligados. As mensagens dos últimos 3 dias chegam em instantes.")); carregar(true); }); }); });
    $$("[data-conversa]", el).forEach(function(b){ b.addEventListener("click", function(){
      conversa(b.dataset.conversa, b.dataset.marcar ? b.dataset.marcar.split(",").filter(Boolean) : []); }); });
    $$("[data-resumir]", el).forEach(function(b){ b.addEventListener("click", function(){
      b.disabled = true; b.textContent = "Resumindo…";
      chamar("resumir", { jid: b.dataset.resumir }).then(function(j){ toast(j.error || "Resumo atualizado."); carregar(true); }); }); });
    $$("[data-filtro]", el).forEach(function(b){ b.addEventListener("click", function(){
      var p = b.dataset.filtro.split(":"); filtroItens[p[0]] = p[1]; desenhar(); }); });
    $$("[data-item]", el).forEach(function(b){ b.addEventListener("click", function(){
      var p = b.dataset.item.split(":");
      D.itens.forEach(function(i){ if(i.id === p[0]) i.status = p[1]; }); desenhar();
      chamar("item", { id: p[0], status: p[1] }).then(function(j){ if(j.error) toast(j.error); }); }); });
    $$("[data-novo-envio]", el).forEach(function(b){ b.addEventListener("click", function(){ abrirEnvio(null); }); });
    $$("[data-editar]", el).forEach(function(b){ b.addEventListener("click", function(){
      abrirEnvio(D.envios.filter(function(e){ return e.id === b.dataset.editar; })[0]); }); });
    $$("[data-pausar]", el).forEach(function(b){ b.addEventListener("click", function(){
      var p = b.dataset.pausar.split(":"); b.disabled = true;
      chamar("envio_pausar", { id: p[0], ativo: p[1] === "true" }).then(function(j){ toast(j.error || (p[1] === "true" ? "Retomado." : "Pausado.")); carregar(true); }); }); });
    $$("[data-remover]", el).forEach(function(b){ b.addEventListener("click", function(){
      if(!confirm("Remover este envio?")) return;
      chamar("envio_remover", { id: b.dataset.remover }).then(function(j){ toast(j.error || "Removido."); carregar(true); }); }); });
    $$("[data-fgrupos]", el).forEach(function(b){ b.addEventListener("click", function(){ filtroGrupos = b.dataset.fgrupos; grupos(); }); });
    $$("[data-ligar]", el).forEach(function(b){ b.addEventListener("click", function(){
      var jid = b.dataset.ligar, novo = b.getAttribute("aria-checked") !== "true";
      b.setAttribute("aria-checked", novo);
      D.grupos.forEach(function(g){ if(g.jid === jid) g.ativo = novo; });
      var tipo = ($('[data-tipo="' + jid + '"]', el) || {}).value;
      chamar("grupo_salvar", { jid: jid, ativo: novo, tipo: tipo }).then(function(j){
        toast(j.error || (novo ? "Ligado. As mensagens dos últimos 3 dias chegam em instantes." : "Desligado.")); }); }); });
    $$("[data-tipo]", el).forEach(function(s){ s.addEventListener("change", function(){
      var jid = s.dataset.tipo, t = s.value;
      D.grupos.forEach(function(g){ if(g.jid === jid) g.tipo = t; });
      chamar("grupo_salvar", { jid: jid, tipo: t }).then(function(j){ toast(j.error || ("Agora: " + TIPOS[t] + ".")); }); }); });
  }

  $$(".gp-aba").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.aba === aba ? "true" : "false"); });
