<!-- Diário de reuniões do Jimmy (nov/2026): leads das chamadas do Meet, status das reuniões,
     lembretes, comentários e mensagem ao lead. Mesmo login do /admin; tudo passa pela função
     "reunioes" (db/21-reunioes.sql). Quem preenche é o assistente do Mac
     (Reunioes/_ferramentas/assistente), que também manda os lembretes no WhatsApp (1575).
     Demonstração sem login: /reunioes?demo -->

<style>
:root{
  --ink:#0A0D0C; --surface:#111614; --surface-2:#171E1B; --line:#232E29; --line-soft:#1A211E;
  --text:#EAF2ED; --muted:#8FA39A; --muted-dim:#61736B;
  --credit:#34DB8B; --credit-dim:#1F7D52;
  --quente:#F07B4F; --morno:#E0A83C; --frio:#6BA8D8; --perigo:#C4785A;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
a{color:var(--credit)}
:focus-visible{outline:2px solid var(--credit);outline-offset:2px;border-radius:3px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:clamp(14px,3.5vw,28px)}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.mudo{color:var(--muted)}
.mini{font-size:.8rem}

.top{position:sticky;top:0;z-index:40;background:rgba(10,13,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top__in{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding-block:.8rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--credit)}
.brand small{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dim);font-weight:400;margin-top:.15rem}
.top__act{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}

.btn{font-family:var(--body);font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.58em 1em;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;transition:border-color .16s,background .16s;white-space:nowrap}
.btn:hover{border-color:var(--muted-dim);background:var(--surface)}
.btn--primary{background:var(--credit);border-color:var(--credit);color:#04120B}
.btn--primary:hover{background:#4BEA9C;border-color:#4BEA9C}
.btn--sm{font-size:.78rem;padding:.42em .75em}
.btn--perigo{border-color:rgba(196,120,90,.5);color:#E3A58C}
.btn--perigo:hover{background:rgba(196,120,90,.12);border-color:var(--perigo)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.inp,.sel,textarea.inp{font-family:var(--body);font-size:.88rem;padding:.55em .8em;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);min-width:0}
.inp::placeholder{color:var(--muted-dim)}
.inp:focus,.sel:focus{outline:none;border-color:var(--credit-dim)}
textarea.inp{width:100%;min-height:84px;resize:vertical;line-height:1.45}
label.campo{display:flex;flex-direction:column;gap:.25rem;font-size:.76rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
label.campo .inp,label.campo .sel{font-family:var(--body);letter-spacing:0}

.demo{background:rgba(224,168,60,.1);border-bottom:1px solid rgba(224,168,60,.3);color:#E0A83C;font-family:var(--mono);font-size:.74rem;padding:.6rem 0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-block:1.3rem}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);padding:.9rem 1.1rem}
.stat dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:.35rem}
.stat dd{margin:0;font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat--hi dd{color:var(--credit)}

.abas{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.aba{font-family:var(--body);font-weight:600;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:.65rem .9rem;cursor:pointer;white-space:nowrap}
.aba[aria-selected="true"]{color:var(--text);border-bottom-color:var(--credit)}
.aba .n{font-family:var(--mono);font-size:.72rem;color:var(--muted-dim);margin-left:.3rem}

.filtros{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.filtros .inp{flex:1;min-width:160px}

.lista{display:flex;flex-direction:column;gap:.55rem;margin-bottom:3rem}
.vazio{border:1px dashed var(--line);border-radius:10px;padding:1.4rem;text-align:center;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card__cab{display:flex;gap:.75rem;align-items:flex-start;padding:.85rem 1rem;cursor:pointer}
.card__cab:hover{background:var(--surface-2);border-radius:10px}
.card__qm{flex:1;min-width:0}
.card__nome{font-weight:600;font-size:1rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.card__meta{font-size:.82rem;color:var(--muted);margin-top:.15rem;overflow-wrap:anywhere}
.card__prox{font-size:.82rem;margin-top:.3rem;color:var(--text)}
.card__dir{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex-shrink:0}
.card__corpo{border-top:1px solid var(--line-soft);padding:1rem;display:flex;flex-direction:column;gap:1.15rem}
.seta{color:var(--muted-dim);font-size:.8rem;transition:transform .15s}
.card.aberto .seta{transform:rotate(90deg)}

.pill{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;padding:.12rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill--quente{color:var(--quente);border-color:rgba(240,123,79,.45)}
.pill--morno{color:var(--morno);border-color:rgba(224,168,60,.45)}
.pill--frio{color:var(--frio);border-color:rgba(107,168,216,.45)}
.pill--ganho{color:var(--credit);border-color:var(--credit-dim)}
.pill--perdido{color:#E3A58C;border-color:rgba(196,120,90,.45)}
.pill--pausado{color:var(--muted-dim)}
.pill--aberto{color:var(--text)}

.bloco h3{font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:.55rem}
.linha-acoes{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.grade{display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:620px){.grade{grid-template-columns:1fr 1fr}}

.reuniao{border-left:2px solid var(--line);padding:.1rem 0 .1rem .8rem;margin-bottom:.8rem}
.reuniao__cab{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.86rem}
.reuniao p{font-size:.88rem;margin-top:.3rem}
.reuniao ul{margin:.35rem 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--muted)}
.reuniao ul li{margin-bottom:.15rem}

.lemb{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.bloco .lemb{background:var(--surface-2)}
.lemb__q{font-family:var(--mono);font-size:.74rem;color:var(--credit);white-space:nowrap;min-width:6.2rem;padding-top:.1rem}
.lemb__q.atrasado{color:var(--quente)}
.lemb__t{flex:1;min-width:0;font-size:.9rem}
.lemb__t small{display:block;color:var(--muted);font-size:.78rem}
.lemb__a{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.lemb.feito .lemb__t{color:var(--muted-dim);text-decoration:line-through}
@media(max-width:560px){.lemb{flex-wrap:wrap}.lemb__a{width:100%;justify-content:flex-start}}

.coment{font-size:.88rem;padding:.55rem .75rem;background:var(--surface-2);border-radius:6px;margin-bottom:.4rem;display:flex;gap:.5rem}
.coment div{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.coment small{display:block;font-family:var(--mono);font-size:.68rem;color:var(--muted-dim);margin-bottom:.15rem}
.xis{background:none;border:0;color:var(--muted-dim);cursor:pointer;font-size:1rem;line-height:1;padding:.1rem .25rem}
.xis:hover{color:#E3A58C}

.envio{font-size:.8rem;color:var(--muted);margin-top:.35rem}
.envio b{font-weight:500;color:var(--text)}

.dia{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-dim);margin:1rem 0 .45rem}

.login{min-height:70vh;display:grid;place-items:center}
.login__box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.6rem;display:flex;flex-direction:column;gap:.85rem}
.erro{color:#E3A58C;font-size:.84rem}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:.65rem 1rem;border-radius:8px;font-size:.88rem;z-index:80;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.erro{border-color:rgba(196,120,90,.6);color:#F0B49C}
</style>

<header class="top">
  <div class="wrap top__in">
    <div class="brand">Diário de <em>reuniões</em><small>leads das chamadas · lembretes</small></div>
    <div class="top__act">
      <a class="btn btn--sm" href="/admin">Painel de leads</a>
      <button class="btn btn--sm" id="btn-atualizar" type="button">Atualizar</button>

</header>
<div class="demo hidden" id="demo-banner"><div class="wrap">Demonstração com dados de exemplo: nada é gravado nem enviado.</div></div>

<main class="wrap">
  <div class="login hidden" id="tela-login">
    <form class="login__box" id="form-login">
      <h2>Entrar</h2>

  </div>

  <div class="hidden" id="app">
    <dl class="stats">
      <div class="stat stat--hi"><dt>Leads em aberto</dt><dd id="st-abertos">0</dd></div>
      <div class="stat"><dt>Quentes</dt><dd id="st-quentes">0</dd></div>
      <div class="stat"><dt>Lembretes hoje</dt><dd id="st-hoje">0</dd></div>

    <nav class="abas" role="tablist">

</main>

<script>
var CFG = {
  url: "https://buapklmgdjcoyzrmhhcd.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1YXBrbG1nZGpjb3l6cm1oaGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTkyNzMsImV4cCI6MjEwNDc5NTI3M30.niDSHwVkcu9GsqgBv-q4BWBclN41lCI3VarB4cix00Y"
};
var DEMO = /[?&]demo\b/.test(location.search) || !CFG.url;
var TZ = "America/Sao_Paulo";
var sb = null;
var D = { leads: [], reunioes: [], lembretes: [], comentarios: [], envios: [] };
var abertos = {};          // leads expandidos
var instCache = null;      // instâncias da Evolution (carregadas uma vez)

function $(s, el){ return (el || document).querySelector(s); }
function esc(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function digitos(t){ return String(t || "").replace(/\D/g, ""); }

/* ---------- datas (sempre no fuso de Brasília) ---------- */
function partes(d){
  var f = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", weekday:"short", hour12:false});
  var o = {}; f.formatToParts(new Date(d)).forEach(function(p){ o[p.type] = p.value; });
  return o;
}
function chaveDia(d){ var p = partes(d); return p.year + "-" + p.month + "-" + p.day; }
function hhmm(d){ var p = partes(d); return (p.hour === "24" ? "00" : p.hour) + ":" + p.minute; }
function quandoCurto(d){
  var hoje = chaveDia(new Date()), amanha = chaveDia(Date.now() + 864e5), ontem = chaveDia(Date.now() - 864e5), k = chaveDia(d);
  var p = partes(d);
  var dia = k === hoje ? "hoje" : k === amanha ? "amanhã" : k === ontem ? "ontem" : p.weekday.replace(".", "") + " " + p.day + "/" + p.month;
  return dia + " " + hhmm(d);
}
function dataCurta(iso){ if(!iso) return ""; var s = String(iso).slice(0,10).split("-"); return s[2] + "/" + s[1]; }
// valor de <input type=datetime-local> (hora de Brasília) → ISO
function deLocal(v){ return v ? new Date(v + ":00-03:00").toISOString() : null; }
function paraLocal(d){ var p = partes(d); return p.year + "-" + p.month + "-" + p.day + "T" + hhmm(d); }
function amanhaAs(h){ var p = partes(Date.now() + 864e5); return new Date(p.year + "-" + p.month + "-" + p.day + "T" + (h < 10 ? "0" + h : h) + ":00:00-03:00"); }

/* ---------- textos ---------- */
var STATUS = {realizada:"✅ realizada", curta:"⚪ curta", sem_gravacao:"❔ sem gravação", nao_compareceu:"❌ não compareceu", remarcada:"🔁 remarcada", agendada:"🗓️ agendada"};
var SITUACAO = {aberto:"em aberto", ganho:"ganho", perdido:"perdido", pausado:"pausado"};
var TEMP = {quente:"🔥 quente", morno:"🟡 morno", frio:"🧊 frio"};
var PRODUTO = {"licenca-igreen":"Licença iGreen", mob:"Mob", telecom:"Telecom", outro:"Outro"};
function opcoes(mapa, atual, vazio){
  var h = vazio ? '<option value="">' + esc(vazio) + '</option>' : "";
  Object.keys(mapa).forEach(function(k){ h += '<option value="' + k + '"' + (k === atual ? " selected" : "") + ">" + esc(mapa[k]) + "</option>"; });
  return h;
}
function toast(msg, erro){
  var t = $("#toast"); t.textContent = msg; t.className = "toast" + (erro ? " erro" : "");
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.add("hidden"); }, erro ? 6000 : 2600);
}

/* ---------- servidor ---------- */
function chamar(acao, dados){
  if(DEMO) return demoChamar(acao, dados || {});
  return sb.auth.getSession().then(function(s){
    var t = s.data.session && s.data.session.access_token;
    if(!t){ location.reload(); throw new Error("sessão"); }
    return fetch(CFG.url + "/functions/v1/reunioes", {
      method:"POST",
      headers:{"Content-Type":"application/json", "apikey":CFG.anonKey, "Authorization":"Bearer " + t},
      body: JSON.stringify(Object.assign({action:acao}, dados || {}))
    });
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.status === 401){ $("#app").classList.add("hidden"); $("#tela-login").classList.remove("hidden"); }
      if(!r.ok) throw new Error(j.error || "Não deu certo agora.");
      return j;
    });
  });
}
function carregar(){
  return chamar("estado").then(function(j){
    D = j; $("#tela-login").classList.add("hidden"); $("#app").classList.remove("hidden"); render();
  }).catch(function(e){ toast(e.message, true); });
}
// executa, recarrega e avisa
function fazer(acao, dados, msg){
  return chamar(acao, dados).then(function(j){ if(msg) toast(msg); return carregar().then(function(){ return j; }); })
    .catch(function(e){ toast(e.message, true); throw e; });
}

/* ---------- derivados ---------- */
function reunioesDe(id){ return D.reunioes.filter(function(r){ return r.lead_id === id; }).sort(function(a,b){ return String(b.data + b.hora).localeCompare(String(a.data + a.hora)); }); }
function lembretesDe(id){ return D.lembretes.filter(function(l){ return l.lead_id === id && (l.status === "pendente" || l.status === "enviado"); }); }
function aberto(l){ return l.status === "pendente" || l.status === "enviado"; }
function nomeLead(id){ var l = D.leads.find(function(x){ return x.id === id; }); return l ? l.nome : ""; }
function ultimaData(lead){ var r = reunioesDe(lead.id)[0]; return r ? r.data + " " + (r.hora || "") : String(lead.atualizado_em || ""); }

function render(){
  var hoje = chaveDia(new Date()), semana = chaveDia(Date.now() - 7 * 864e5);
  $("#st-abertos").textContent = D.leads.filter(function(l){ return l.situacao === "aberto"; }).length;
  $("#st-quentes").textContent = D.leads.filter(function(l){ return l.situacao === "aberto" && l.temperatura === "quente"; }).length;
  $("#st-hoje").textContent = D.lembretes.filter(function(l){ return aberto(l) && chaveDia(l.quando) <= hoje; }).length;
  $("#st-semana").textContent = D.reunioes.filter(function(r){ return r.data >= semana; }).length;
  $("#n-leads").textContent = D.leads.length;
  $("#n-lembretes").textContent = D.lembretes.filter(aberto).length;
  $("#n-reunioes").textContent = D.reunioes.length;
  var sel = $("#nl-lead"), v = sel.value;
  sel.innerHTML = '<option value="">Nenhum</option>' + D.leads.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome); })
    .map(function(l){ return '<option value="' + l.id + '">' + esc(l.nome) + "</option>"; }).join("");
  sel.value = v;
  if(!$("#nl-quando").value) $("#nl-quando").value = paraLocal(amanhaAs(9));
  renderLeads(); renderLembretes(); renderReunioes();
}

/* ---------- aba Leads ---------- */
function renderLeads(){
  var q = $("#busca").value.trim().toLowerCase(), sit = $("#f-situacao").value;
  var lista = D.leads.filter(function(l){
    if(sit && l.situacao !== sit) return false;
    if(!q) return true;
    return [l.nome, l.cidade, l.empresa, l.telefone].join(" ").toLowerCase().indexOf(q) >= 0 || (q.replace(/\D/g,"") && digitos(l.telefone).indexOf(q.replace(/\D/g,"")) >= 0);
  }).sort(function(a,b){ return ultimaData(b).localeCompare(ultimaData(a)); });
  var el = $("#lista-leads");

function cardLead(l){

function blocoReuniao(r, comLead){

  if(r.doc_id) h += '<a class="mini" href="https://docs.google.com/document/d/' + encodeURIComponent(r.doc_id) + '/edit" target="_blank" rel="noopener">anotações do Gemini</a>';
  h += "</div>";

  if((r.proximos_passos || []).length){
    h += "<ul>" + r.proximos_passos.map(function(p){ return "<li>" + esc((p.quem ? p.quem + ": " : "") + p.o_que + (p.quando_dito ? " (" + p.quando_dito + ")" : "")) + (p.minuto ? ' <span class="mono">[' + esc(p.minuto) + "]</span>" : "") + "</li>"; }).join("") + "</ul>";

}

function linhaLembrete(l, dentroDoLead){
  var atras = aberto(l) && new Date(l.quando) < new Date();
  var q = l.status === "enviado" ? "enviado" : l.status === "feito" ? "feito" : l.status === "apagado" ? "apagado" : quandoCurto(l.quando);
  var h = '<div class="lemb' + (aberto(l) ? "" : " feito") + '" data-lembrete="' + l.id + '"><div class="lemb__q' + (atras && l.status === "pendente" ? " atrasado" : "") + '">#' + l.id + " " + q + "</div>";
  h += '<div class="lemb__t">' + esc(l.texto) + (!dentroDoLead && (l.lead_id || l.lead) ? "<small>" + esc(nomeLead(l.lead_id) || l.lead) + "</small>" : "");
  if(l.status === "enviado") h += "<small>chegou no WhatsApp " + quandoCurto(l.enviado_em) + ", sem resposta</small>";
  h += '<form class="hidden" data-form="editar-lembrete" style="margin-top:.5rem"><input class="inp" name="texto" value="' + esc(l.texto) + '" style="width:100%;margin-bottom:.4rem" required>';
  h += '<input class="inp" name="quando" type="datetime-local" value="' + paraLocal(l.quando) + '"> <button class="btn btn--primary btn--sm" type="submit">Salvar</button></form></div>';
  h += '<div class="lemb__a">';

    h += '<button class="btn btn--sm" data-acao="feito">Feito</button>';
    h += '<button class="btn btn--sm" data-acao="adiar-1h">+1 h</button><button class="btn btn--sm" data-acao="adiar-amanha">Amanhã 9h</button>';
    h += '<button class="btn btn--sm" data-acao="editar-lembrete">Editar</button><button class="btn btn--sm btn--perigo" data-acao="apagar-lembrete">Apagar</button>';
  } else {
    h += '<button class="btn btn--sm" data-acao="reabrir">Reabrir</button>';
  }
  return h + "</div></div>";
}
function renderLembretes(){

/* ---------- aba Reuniões ---------- */
function renderReunioes(){

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-acao]"); if(!b) return;

    var card = b.closest(".card");

  }
  if(acao === "fechar-form"){ b.closest("form").classList.add("hidden"); return; }
  if(acao === "remover"){
    var lead = D.leads.find(function(x){ return x.id === id; });
    if(confirm("Remover " + lead.nome + "? Apaga também as reuniões, os lembretes e os comentários dele.")) fazer("lead_remover", {id:id}, "Lead removido.");
    return;
  }
  if(acao === "remover-reuniao"){

    mostrarAba("leads"); renderLeads(); var el = document.querySelector('[data-lead="' + lidLead + '"]'); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return;
  }
  if(acao === "feito") return fazer("lembrete_salvar", {id:lid, status:"feito"}, "Feito ✅");
  if(acao === "reabrir") return fazer("lembrete_salvar", {id:lid, status:"pendente"}, "Lembrete reaberto.");
  if(acao === "apagar-lembrete"){ if(confirm("Apagar este lembrete?")) fazer("lembrete_salvar", {id:lid, status:"apagado"}, "Lembrete apagado."); return; }
  if(acao === "adiar-1h") return fazer("lembrete_salvar", {id:lid, quando:new Date(Date.now() + 36e5).toISOString()}, "Adiado 1 hora.");

});

/* ---------- demonstração (?demo) ---------- */
function demoChamar(acao, d){
  var agora = new Date().toISOString();
  var L = function(id){ return D.lembretes.find(function(x){ return x.id === id; }); };
  if(acao === "estado") return Promise.resolve(D);
  if(acao === "lead_salvar"){ var l = D.leads.find(function(x){ return x.id === d.id; }); Object.keys(d).forEach(function(k){ if(k !== "id") l[k] = d[k]; }); }
  if(acao === "lead_remover") D.leads = D.leads.filter(function(x){ return x.id !== d.id; });
  if(acao === "reuniao_salvar"){ var r = D.reunioes.find(function(x){ return x.chave === d.chave; }); r.status = d.status; }
  if(acao === "reuniao_remover") D.reunioes = D.reunioes.filter(function(x){ return x.chave !== d.chave; });
  if(acao === "lembrete_salvar"){ var x = L(d.id); if(d.status) x.status = d.status; if(d.quando){ x.quando = d.quando; x.status = "pendente"; } if(d.texto) x.texto = d.texto; x.atualizado_em = agora; }
  if(acao === "lembrete_criar") D.lembretes.push({id: D.lembretes.length + 1, texto:d.texto, quando:d.quando, lead_id:d.lead_id, status:"pendente", atualizado_em:agora});
  if(acao === "comentar") D.comentarios.unshift({id: Date.now(), lead_id:d.lead_id, texto:d.texto, criado_em:agora});
  if(acao === "comentario_remover") D.comentarios = D.comentarios.filter(function(c){ return c.id !== d.id; });
  if(acao === "instancias") return Promise.resolve({instancias:[{nome:"pessoal",estado:"open",numero:"554891067007"},{nome:"carregador",estado:"open",numero:"554788092413"},{nome:"Debora",estado:"close",numero:"554791997299"}]});
  if(acao === "enviar"){ D.envios.unshift({lead_id:d.lead_id, instancia:d.instancia, texto:d.texto, status:"ok", criado_em:agora}); return Promise.resolve({status:"ok"}); }
  return Promise.resolve({ok:true});
}
